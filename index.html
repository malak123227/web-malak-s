<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Now</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ✅ مسار نسبي — يشتغل محليًا وعلى GitHub Pages -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <canvas id="particlesCanvas"></canvas>

  <header class="header wrapper">
    <div class="header__content">

      <a class="header__homelink" href="index.html">
        <!--
          ✅ مسار نسبي للشعار
          onerror يخفي الصورة لو ما وجدت ويبقي النص
        -->
        <img
          class="header__logo"
          src="assets/images/logo.svg"
          alt="Weather Now"
          width="197" height="40"
          onerror="this.style.display='none'"
        >
      </a>

      <div class="dropdown-wrap">
        <select id="ddlUnits" class="dropdown">
          <option value="C">🌡️ °C</option>
          <option value="F">🔥 °F</option>
        </select>
      </div>

    </div>
  </header>

  <main id="main" class="main wrapper">

    <section class="hero">
      <div class="hero__content">
        <h1 class="hero__title">How's the sky looking today?</h1>
        <div class="hero__search">
          <input
            class="hero__textbox"
            type="text"
            name="search"
            id="txtSearch"
            placeholder="Search for a place..."
            autocomplete="off"
          >
          <button id="btnSearch" class="hero__button" type="button">Search</button>
        </div>
      </div>
    </section>

    <div class="dashboard">

      <section class="current">

        <div class="current__weather">
          <div class="current__location">
            <div id="dvCityCountry" class="current__city">—</div>
            <div id="dvCurrDate"    class="current__date">—</div>
          </div>
          <div class="current__info">
            <!--
              ✅ مسار نسبي للأيقونة
              JS في script.js يغيّر src إلى: assets/images/icon-{codeName}.webp
              onerror يعرض emoji احتياطي لو الصورة مش موجودة
            -->
            <img
              class="current__icon"
              src="assets/images/icon-sunny.webp"
              alt="sunny"
              width="200" height="200"
              onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=&quot;font-size:5rem&quot;>☀️</span>')"
            >
            <div class="current__temp">
              <span id="dvCurrTemp">—</span>&deg;
            </div>
          </div>
        </div>

        <div class="current__conditions">

          <div class="block current__condition">
            <p class="current__condition-title">Feels Like</p>
            <p class="current__condition-value"><span id="pFeelsLike">—</span>&deg;</p>
          </div>

          <div class="block current__condition">
            <p class="current__condition-title">Humidity</p>
            <p class="current__condition-value"><span id="pHumidity">—</span>%</p>
          </div>

          <div class="block current__condition">
            <p class="current__condition-title">Wind</p>
            <p id="pWind" class="current__condition-value">—</p>
          </div>

          <div class="block current__condition">
            <p class="current__condition-title">Precipitation</p>
            <p id="pPrecipitation" class="current__condition-value">—</p>
          </div>

          <div class="block current__condition">
            <p class="current__condition-title">UV Index</p>
            <p class="current__condition-value uv-row">
              <span id="pUVIndex">—</span>
              <span id="pUVLabel" class="uv-label"></span>
            </p>
          </div>

          <div class="block current__condition">
            <p class="current__condition-title">Visibility</p>
            <p class="current__condition-value"><span id="pVisibility">—</span> km</p>
          </div>

          <div class="block current__condition sun-card">
            <p class="current__condition-title">Sunrise</p>
            <p class="current__condition-value">🌅 <span id="pSunrise">—</span></p>
          </div>

          <div class="block current__condition sun-card">
            <p class="current__condition-title">Sunset</p>
            <p class="current__condition-value">🌇 <span id="pSunset">—</span></p>
          </div>

        </div>

        <div class="hourly-section">
          <h2 class="section__title">Hourly Forecast</h2>
          <div class="hourly-scroll">
            <div class="hourly-chart" id="hourlyChart"></div>
          </div>
        </div>

      </section>

      <section class="daily">
        <h2 class="section__title daily__title">Daily Forecast</h2>
        <div class="daily__forecast">
          <div id="dvForecastDay1" class="block daily__day"></div>
          <div id="dvForecastDay2" class="block daily__day"></div>
          <div id="dvForecastDay3" class="block daily__day"></div>
          <div id="dvForecastDay4" class="block daily__day"></div>
          <div id="dvForecastDay5" class="block daily__day"></div>
          <div id="dvForecastDay6" class="block daily__day"></div>
          <div id="dvForecastDay7" class="block daily__day"></div>
        </div>
      </section>

    </div>

  </main>

  <button id="btnGeolocate" class="btn-geo" title="Use my location" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="8" stroke-opacity=".35"/>
    </svg>
  </button>

  <!-- ✅ مسار نسبي للـ JS في آخر الـ body -->
  <script src="script.js"></script>

</body>
</html>
